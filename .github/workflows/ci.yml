name: CI

on:
  push:
    branches: [ master, main, develop ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: read

# The quality-check target is the single source of truth for formatting, lint,
# security, build, unit, and self-contained E2E checks.  The platform matrix
# below only adds cross-platform build coverage; it intentionally does not run
# the quality gate again.
jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    env:
      GOWORK: off

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.6'
        cache: true

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        version: '0.9.17'

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Install pinned quality tools
      run: make install-quality-tools

    - name: Validate quality workflow
      run: make quality-check-validate

    - name: Run canonical quality gate
      run: make quality-check QUALITY_COVERAGE_OUT="${{ runner.temp }}/coverage-unit.out"

    - name: Upload coverage
      uses: codecov/codecov-action@v7
      with:
        files: ${{ runner.temp }}/coverage-unit.out
        flags: unittests
        name: codecov-umbrella
        # This upload is currently unauthenticated: no CODECOV_TOKEN secret is
        # referenced anywhere else in the tree, and whether Codecov still
        # accepts a tokenless upload here depends on its own rules for this
        # repository, which are not observable from the checkout. Wiring the
        # token is free either way — an undefined secret evaluates to an empty
        # string, which behaves exactly as no token does — and is the whole fix
        # once the secret is created.
        token: ${{ secrets.CODECOV_TOKEN }}
        # Was true, which made an unauthenticated upload fail the whole Quality
        # gate job. That never showed up because format-check died first and
        # this step was skipped; fixing format-check would have made it the new
        # failure. Coverage reporting is not the merge gate here — `make
        # quality-check`, which runs immediately above, is.
        fail_ci_if_error: false

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      GOWORK: off

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.6'
        cache: true

    - name: Build binary
      run: make build

    - name: Verify binary (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        ./gz-git --version
        ./gz-git --help

    - name: Verify binary (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        .\gz-git.exe --version
        .\gz-git.exe --help

  examples:
    name: Test Examples
    runs-on: ubuntu-latest
    env:
      GOWORK: off

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.6'
        cache: true

    - name: Test basic example
      run: |
        cd examples/basic
        go run main.go

    - name: Test clone example
      run: |
        go run examples/clone/main.go https://github.com/golang/example.git /tmp/test-clone
        ls -la /tmp/test-clone
