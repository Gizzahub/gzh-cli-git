# GoReleaser configuration for gzh-cli-gitforge
# https://goreleaser.com/customization/

version: 2

project_name: gz-git

git:
  # The snapshot workflow maintains this moving, non-semver release tag.
  # It must not participate in current/previous stable tag discovery.
  ignore_tags:
    - snapshot

before:
  hooks:
    - go mod tidy
    - go mod verify

builds:
  - id: gz-git
    binary: gz-git
    main: ./cmd/gz-git
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    goarm:
      - "7"
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      # main.version backs cobra's `gz-git --version`.
      - -X main.version={{.Version}}
      # The `gz-git version` subcommand does NOT read main.version — it calls
      # gzhcligitforge.VersionString(), which reads these three package-level
      # variables in the module root. Leaving them uninjected made every release
      # binary report the hardcoded default (v0.7.0, commit unknown, built
      # unknown) no matter which tag it was built from.
      #
      # The previous `-X main.commit` and `-X main.date` were dead: package main
      # declares only `version`, and the linker silently ignores -X for a symbol
      # that does not exist.
      #
      # ShortCommit and CommitDate, not Commit and Date: VersionString() renders
      # all three on one line and documents the short form, and dating the build
      # by commit keeps a rebuild of the same tag reporting the same thing --
      # which is what mod_timestamp below already assumes.
      - -X github.com/gizzahub/gzh-cli-gitforge.Version={{.Version}}
      - -X github.com/gizzahub/gzh-cli-gitforge.GitCommit={{.ShortCommit}}
      - -X github.com/gizzahub/gzh-cli-gitforge.BuildDate={{.CommitDate}}
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE*
      - CHANGELOG*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
      - Merge pull request
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Refactoring
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: Others
      order: 999

release:
  github:
    owner: gizzahub
    name: gzh-cli-gitforge
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## gz-git {{.Version}}

    Git repository management CLI tool.
  footer: |
    ---

    ### Installation

    **Homebrew (macOS/Linux)**:
    ```bash
    brew tap gizzahub/tap
    brew install --cask gz-git
    ```

    **Go install**:
    ```bash
    go install github.com/gizzahub/gzh-cli-gitforge/cmd/gz-git@{{.Tag}}
    ```

    **Binary download**: See assets below.

# Homebrew Tap configuration
homebrew_casks:
  - name: gz-git
    ids:
      - default
    binary: gz-git
    directory: Casks
    repository:
      owner: gizzahub
      name: homebrew-tap
      # Personal Access Token with repo scope
      # Set as HOMEBREW_TAP_TOKEN in GitHub Secrets
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"

    # Git author for cask updates
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    commit_msg_template: "Brew cask update for {{ .ProjectName }} version {{ .Tag }}"

    # Cask metadata
    homepage: "https://github.com/gizzahub/gzh-cli-gitforge"
    description: "Git repository management CLI tool with multi-forge support"
    license: "MIT"

    # Release binaries are not notarized, so remove macOS quarantine metadata.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gz-git"]
          end

    # Optional: dependencies
    # dependencies:
    #   - name: git
    #     type: optional

    # Optional: caveats shown after installation
    # caveats: |
    #   To use gz-git as a git subcommand, create a symlink:
    #     ln -sf $(brew --prefix)/bin/gz-git $(brew --prefix)/bin/git-gitforge
    #
    #   Then you can use: git gitforge <command>

# Optional: Scoop for Windows users
