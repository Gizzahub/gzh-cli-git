# Repo-root declaration for integrate/reclaim. Read by
# config.LoadRepoRootTaskPattern (repo-root file only, never the upward
# merger). taskPattern is the reclaim allow-list: the prefix before the
# first '*' marks a task-branch namespace, so agent/* also covers
# agent/<task>/<agent-id> and dev/*/*/* covers
# dev/<actor>/<type>/<slug>.
branch:
  integrationBranch:
    - master
  taskPattern:
    - dev/*/*/*
    - feat/*
    - fix/*
    - docs/*
    - refactor/*
    - test/*
    - chore/*
    - agent/*
    - hotfix/*
